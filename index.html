<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قیمت لحظه‌ای طلا، سکه و ارز</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f2a2a; --bg2:#0a1d1e; --surface:#153536; --line:rgba(226,182,92,.18);
  --ink:#f5eedc; --muted:#8fb0ac; --brass:#e2b65c; --brass2:#f6dc9b;
  --up:#5fd38d; --down:#ff7a6b; --flat:#8fb0ac;
  --font:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0}
html{color-scheme:dark}
body{
  font-family:var(--font); color:var(--ink); min-height:100vh;
  background:
    radial-gradient(900px 500px at 85% -10%, rgba(226,182,92,.16), transparent 60%),
    radial-gradient(700px 500px at 0% 110%, rgba(95,211,141,.07), transparent 60%),
    linear-gradient(180deg,var(--bg),var(--bg2));
  background-attachment:fixed;
  padding:max(20px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));
}
.progress{position:fixed;inset:0 0 auto 0;height:3px;background:transparent;z-index:5}
.progress i{display:block;height:100%;width:100%;transform-origin:right;background:linear-gradient(270deg,var(--brass),var(--brass2));transform:scaleX(0)}
.progress i.run{animation:drain 60s linear forwards}
@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}

.wrap{max-width:1080px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 22px;flex-wrap:wrap}
.top h1{font-size:1.15rem;font-weight:600;letter-spacing:0}
.status{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--up);box-shadow:0 0 0 0 rgba(95,211,141,.6);animation:pulse 2s infinite}
.status.err .dot{background:var(--down);animation:none}
.status.err{color:var(--down)}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(95,211,141,0)}100%{box-shadow:0 0 0 0 rgba(95,211,141,0)}}

/* Hero */
.hero{
  position:relative;overflow:hidden;border-radius:28px;padding:30px 28px 26px;margin-bottom:18px;
  background:linear-gradient(135deg,rgba(226,182,92,.14),rgba(21,53,54,.9) 55%);
  border:1px solid var(--line);
}
.hero::after{ /* light sweep, runs once */
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(100deg,transparent 35%,rgba(246,220,155,.22) 50%,transparent 65%);
  transform:translateX(120%);animation:sweep 1.8s .5s ease-out forwards;
}
@keyframes sweep{to{transform:translateX(-120%)}}
.hero h2{font-size:1rem;font-weight:600;color:var(--muted)}
.hero .big{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:8px 0 10px}
.hero .num{font-size:clamp(2.6rem,9vw,5rem);font-weight:800;line-height:1.15;color:var(--brass2);font-variant-numeric:tabular-nums}
.hero .unit{color:var(--muted);font-size:1rem}
.hero-meta{display:flex;gap:18px 28px;align-items:center;flex-wrap:wrap}
.hero .range{flex:1 1 260px;max-width:420px}

/* Cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{
  background:var(--surface);border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:18px 18px 14px;
  display:flex;flex-direction:column;gap:10px;opacity:0;transform:translateY(14px);
  transition:background .9s;
}
.card.in{opacity:1;transform:none;transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1),background .9s}
.card.flash,.hero.flash{background-color:rgba(226,182,92,.18)}
.card header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h3{font-size:.98rem;font-weight:600}
.per{font-size:.75rem;color:var(--muted)}
.price{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.price .num{font-size:1.65rem;font-weight:800;font-variant-numeric:tabular-nums}
.price .unit{font-size:.8rem;color:var(--muted)}
.rial{font-size:.78rem;color:var(--muted);margin-top:-6px}

.chg{display:inline-flex;align-items:center;gap:6px;width:fit-content;font-size:.82rem;font-weight:600;padding:3px 10px;border-radius:999px;
  background:rgba(143,176,172,.14);color:var(--flat)}
.chg.up{background:rgba(95,211,141,.14);color:var(--up)}
.chg.down{background:rgba(255,122,107,.14);color:var(--down)}

.range{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.range em{display:block;font-style:normal;font-size:.68rem;opacity:.8}
.range b{font-weight:600;color:var(--ink)}
.range .hi{text-align:right}.range .lo{text-align:left}
.track{position:relative;height:4px;border-radius:4px;background:rgba(255,255,255,.1)}
.mark{position:absolute;top:50%;right:100%;width:12px;height:12px;border-radius:50%;background:var(--brass);
  transform:translate(50%,-50%);box-shadow:0 0 0 4px rgba(226,182,92,.2);transition:right 1.2s cubic-bezier(.2,.8,.2,1)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:.72rem;color:var(--muted);margin-top:2px}
.badge{padding:2px 8px;border-radius:6px;background:rgba(226,182,92,.14);color:var(--brass)}
.badge[hidden]{display:none}

@media (max-width:520px){.hero{padding:22px 18px}.grid{grid-template-columns:1fr 1fr;gap:10px}.card{padding:14px 12px 12px}.price .num{font-size:1.25rem}}
@media (max-width:360px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .card{opacity:1;transform:none}
}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
</style>
</head>
<body>
<div class="progress" aria-hidden="true"><i id="bar"></i></div>
<main class="wrap">
  <div class="top">
    <h1>قیمت طلا، سکه و ارز</h1>
    <div class="status" id="status" role="status"><span class="dot"></span><span id="statusText">در حال دریافت قیمت‌ها…</span></div>
  </div>

  <section class="hero" id="hero" aria-label="طلای جهانی"></section>
  <section class="grid" id="grid" aria-label="قیمت‌ها"></section>
</main>

<script>
const ENDPOINTS = ["https://call2.tgju.org/ajax.json","https://call1.tgju.org/ajax.json"];
const HERO = {k:"ons",label:"طلای جهانی (انس طلا)",unit:"دلار / هر اونس",dec:2,global:true};
const ITEMS = [
  {k:"crypto-tether-irr",label:"تتر",per:"۱ تتر"},
  {k:"price_dollar_rl",label:"دلار آمریکا",per:"۱ دلار"},
  {k:"geram18",label:"طلای ۱۸ عیار",per:"هر گرم"},
  {k:"sekee",label:"سکه تمام جدید",per:"امامی"},
  {k:"sekeb",label:"سکه تمام قدیم",per:"بهار آزادی"},
  {k:"nim",label:"نیم سکه",per:"۱ سکه"},
  {k:"rob",label:"ربع سکه",per:"۱ سکه"},
];

// آخرین مقادیر شناخته‌شده (نمونهٔ اولیه تا رسیدن پاسخ زنده)
const SEED = {
 "ons":{p:"4,054.51",h:"4,063.78",l:"4,026.98",d:"20.57",dp:0.51,dt:"high",t:"۰۹:۳۴:۵۲",ts:"2026-11-11 09:34:52"},
 "crypto-tether-irr":{p:"2,548,850",h:"2,639,370",l:"2,040,480",d:"0",dp:0,dt:"",t:"۱۹ آبان",ts:"2026-11-10 00:00:00"},
 "price_dollar_rl":{p:"2,599,000",h:"2,639,000",l:"2,598,600",d:"0",dp:0,dt:"",t:"۱۹ آبان",ts:"2026-11-10 00:00:00"},
 "geram18":{p:"249,310,000",h:"249,310,000",l:"249,310,000",d:"0",dp:0,dt:"",t:"۱۹ آبان",ts:"2026-11-10 00:00:00"},
 "sekee":{p:"2,516,600,000",h:"2,578,200,000",l:"2,516,500,000",d:"0",dp:0,dt:"",t:"۱۹ آبان",ts:"2026-11-10 00:00:00"},
 "sekeb":{p:"2,459,650,000",h:"2,491,000,000",l:"2,459,500,000",d:"0",dp:0,dt:"",t:"۱۹ آبان",ts:"2026-11-10 00:00:00"},
 "nim":{p:"1,328,600,000",h:"1,355,900,000",l:"1,328,600,000",d:"0",dp:0,dt:"",t:"۱۹ آبان",ts:"2026-11-10 00:00:00"},
 "rob":{p:"713,300,000",h:"724,800,000",l:"713,300,000",d:"0",dp:0,dt:"",t:"۱۹ آبان",ts:"2026-11-10 00:00:00"},
};

const $ = (s,r=document)=>r.querySelector(s);
const num = s => Number(String(s).replace(/,/g,"").trim()) || 0;
const fmt = (n,dec=0)=>n.toLocaleString("fa-IR",{minimumFractionDigits:dec,maximumFractionDigits:dec});
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const tehranToday = ()=>new Date().toLocaleDateString("sv-SE",{timeZone:"Asia/Tehran"});

/* ---------- ساخت اسکلت ---------- */
const hero = $("#hero"), grid = $("#grid");
hero.innerHTML = `
  <h2>${HERO.label}</h2>
  <div class="big"><span class="num" data-num>۰</span><span class="unit">${HERO.unit}</span></div>
  <div class="hero-meta">
    <span class="chg" data-chg></span>
    <div class="range"><span class="hi"><em>بیشترین</em><b data-hi></b></span><div class="track"><i class="mark" data-mark></i></div><span class="lo"><em>کمترین</em><b data-lo></b></span></div>
  </div>
  <div class="foot" style="margin-top:14px"><span class="badge" data-badge hidden>قیمت پایانی روز قبل</span><time data-time></time></div>`;
grid.innerHTML = ITEMS.map(it=>`
  <article class="card" data-k="${it.k}">
    <header><h3>${it.label}</h3><span class="per">${it.per}</span></header>
    <div class="price"><span class="num" data-num>۰</span><span class="unit">تومان</span></div>
    <div class="rial" data-rial></div>
    <span class="chg" data-chg></span>
    <div class="range"><span class="hi"><em>بیشترین</em><b data-hi></b></span><div class="track"><i class="mark" data-mark></i></div><span class="lo"><em>کمترین</em><b data-lo></b></span></div>
    <div class="foot"><span class="badge" data-badge hidden>قیمت پایانی روز قبل</span><time data-time></time></div>
  </article>`).join("");

/* ---------- انیمیشن شمارش ---------- */
const shown = new Map();
function countTo(el,key,to,dec){
  const from = shown.get(key) ?? 0;
  shown.set(key,to);
  if(reduce || from===to){ el.textContent = fmt(to,dec); return; }
  const t0 = performance.now(), dur = from===0 ? 1600 : 900;
  cancelAnimationFrame(el._raf);
  const step = now=>{
    const p = Math.min(1,(now-t0)/dur), e = 1-Math.pow(1-p,4);
    el.textContent = fmt(from+(to-from)*e,dec);
    if(p<1) el._raf = requestAnimationFrame(step);
  };
  el._raf = requestAnimationFrame(step);
}

function paint(root,key,e,{div=1,dec=0}){
  const p=num(e.p)/div, h=num(e.h)/div, l=num(e.l)/div, d=num(e.d)/div;
  const prev = shown.get(key);
  countTo($("[data-num]",root),key,p,dec);
  const rial = $("[data-rial]",root); if(rial) rial.textContent = fmt(num(e.p))+" ریال";
  const chg = $("[data-chg]",root), dir = e.dt==="high"?"up":e.dt==="low"?"down":"";
  chg.className = "chg "+dir;
  chg.textContent = dir ? `${dir==="up"?"▲":"▼"} ${fmt(Math.abs(e.dp),2)}٪ (${fmt(Math.abs(d),dec)})` : "— بدون تغییر";
  $("[data-lo]",root).textContent = fmt(l,dec);
  $("[data-hi]",root).textContent = fmt(h,dec);
  const pos = h>l ? Math.min(1,Math.max(0,(p-l)/(h-l))) : .5;
  requestAnimationFrame(()=>{ $("[data-mark]",root).style.right = ((1-pos)*100)+"%"; });
  const live = (e.ts||"").slice(0,10)===tehranToday();
  $("[data-badge]",root).hidden = live;
  $("[data-time]",root).textContent = "آخرین به‌روزرسانی: "+e.t;
  if(prev!==undefined && prev!==p && !reduce){ root.classList.add("flash"); setTimeout(()=>root.classList.remove("flash"),900); }
}

function render(cur){
  paint(hero,HERO.k,cur[HERO.k],{div:1,dec:2});
  ITEMS.forEach(it=>{
    const root = $(`[data-k="${it.k}"]`);
    if(cur[it.k]) paint(root,it.k,cur[it.k],{div:10,dec:0});
  });
}

/* ---------- دریافت داده ---------- */
const statusEl = $("#status"), statusText = $("#statusText"), bar = $("#bar");
let last = SEED;

async function load(){
  for(const url of ENDPOINTS){
    try{
      const r = await fetch(url,{cache:"no-store"});
      if(!r.ok) continue;
      const data = await r.json();
      if(data && data.current) return data.current;
    }catch(_){}
  }
  throw new Error("unreachable");
}

async function refresh(){
  try{
    last = await load();
    statusEl.classList.remove("err");
    statusText.textContent = "متصل · "+new Date().toLocaleTimeString("fa-IR",{timeZone:"Asia/Tehran",hour:"2-digit",minute:"2-digit"});
  }catch(_){
    statusEl.classList.add("err");
    statusText.textContent = "عدم دسترسی به منبع قیمت · آخرین مقادیر نمایش داده می‌شود";
  }
  render(last);
  bar.classList.remove("run"); void bar.offsetWidth; bar.classList.add("run");
}

render(SEED);
document.querySelectorAll(".card").forEach((c,i)=>setTimeout(()=>c.classList.add("in"),reduce?0:350+i*90));
refresh();
setInterval(refresh,60000);
</script>
</body>
</html>
